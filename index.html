<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cine de Terror</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #e50914;
    }
    .contenedor-principal {
      max-width: 800px;
      margin: 0 auto;
    }
    .panel-admin, .buscador-sec {
      background-color: #1e1e1e;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    input, textarea, button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      margin-bottom: 8px;
      border-radius: 5px;
      border: 1px solid #333;
      box-sizing: border-box;
      background-color: #2b2b2b;
      color: #fff;
    }
    button {
      background-color: #e50914;
      color: white;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }
    button:hover {
      background-color: #b20710;
    }
    .catalogo {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }
    .tarjeta {
      background-color: #1e1e1e;
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
    }
    .poster {
      width: 100%;
      height: 320px;
      object-fit: cover;
      border-radius: 5px;
    }
    .genero {
      color: #e50914;
      font-size: 0.9em;
      font-weight: bold;
    }
    .sinopsis {
      font-size: 0.9em;
      color: #ccc;
      flex-grow: 1;
    }
    .video-contenedor {
      margin-top: 10px;
      border-radius: 5px;
      overflow: hidden;
    }
    .btn-like {
      background-color: #333;
      margin-top: 10px;
    }
    .like-activo {
      background-color: #e50914;
    }
  </style>
</head>
<body>

  <div class="contenedor-principal">
    <h1>Cine de Terror</h1>

    <!-- Panel de Agregar Película -->
    <div class="panel-admin">
      <h3>Agregar Película</h3>
      <input type="text" id="titulo" placeholder="Título de la película">
      <input type="text" id="genero" placeholder="Género (ej. Slasher, Paranormal)">
      <input type="url" id="imagen" placeholder="URL de la imagen del póster">
      <input type="url" id="video" placeholder="URL del fragmento o tráiler (YouTube)">
      <textarea id="sinopsis" rows="3" placeholder="Sinopsis"></textarea>
      <input type="password" id="pinAdmin" placeholder="PIN de Administrador">
      <button onclick="agregarPelicula()">Publicar Película</button>
    </div>

    <!-- Buscador -->
    <div class="buscador-sec">
      <input type="text" id="buscador" placeholder="Buscar película..." onkeyup="filtrarPeliculas()">
    </div>

    <!-- Catálogo de Películas -->
    <div id="catalogo" class="catalogo"></div>
  </div>

  <!-- Cargar librería de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Configuración de Supabase
    const SUPABASE_URL = "https://ctrmjdwwvyxpzwgqsapd.supabase.co";
    const SUPABASE_KEY = "Sb_publishable_9WPjJ6rpXsGzXyT0rYBhGw_DeRMp99_";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Cargar al iniciar
    document.addEventListener("DOMContentLoaded", () => {
      cargarPeliculas();
      escucharCambiosEnTiempoReal();
    });

    // Obtener películas de Supabase
    async function cargarPeliculas() {
      const { data, error } = await _supabase
        .from("peliculas")
        .select("*")
        .order("id", { ascending: false });

      if (error) {
        console.error("Error al cargar:", error.message);
        return;
      }
      renderizarCatalogo(data);
    }

    // Renderizar tarjetas en pantalla
    function renderizarCatalogo(peliculas) {
      const catalogo = document.getElementById("catalogo");
      catalogo.innerHTML = "";

      peliculas.forEach((peli) => {
        let videoHTML = "";
        if (peli.video) {
          let videoUrl = peli.video;
          if (videoUrl.includes("watch?v=")) {
            videoUrl = videoUrl.replace("watch?v=", "embed/");
          } else if (videoUrl.includes("youtu.be/")) {
            videoUrl = videoUrl.replace("youtu.be/", "www.youtube.com/embed/");
          }

          videoHTML = `
            <div class="video-contenedor">
              <iframe 
                width="100%" 
                height="180" 
                src="${videoUrl}" 
                title="Fragmento de ${peli.titulo}" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
              </iframe>
            </div>
          `;
        }

        const likeEstado = localStorage.getItem(peli.id);

        const tarjetaHTML = `
          <div class="tarjeta">
            <img src="${peli.imagen}" class="poster" onerror="this.src='https://images.unsplash.com/photo-1509114397022-ed747cca3f65?w=500'">
            <h2>${peli.titulo}</h2>
            <span class="genero">${peli.genero}</span>
            <p class="sinopsis">${peli.sinopsis}</p>
            ${videoHTML}
            <button class="btn-like ${likeEstado ? 'like-activo' : ''}" onclick="darLike(this, '${peli.id}')">
              ❤️ <span class="texto-like">${likeEstado ? '¡Te gusta!' : 'Me gusta'}</span>
            </button>
          </div>
        `;
        catalogo.innerHTML += tarjetaHTML;
      });
    }

    // Guardar nueva película con video
    async function agregarPelicula() {
      const pin = document.getElementById("pinAdmin").value;
      if (pin !== "leslyteamo") { // Cambia "leslyteamo" por tu PIN real
        alert("PIN incorrecto. No tienes permiso para agregar películas.");
        return;
      }

      let titulo = document.getElementById("titulo").value.trim();
      let genero = document.getElementById("genero").value.trim();
      let imagen = document.getElementById("imagen").value.trim();
      let video = document.getElementById("video").value.trim();
      let sinopsis = document.getElementById("sinopsis").value.trim();

      if (!titulo || !genero || !sinopsis) {
        alert("Por favor completa título, género y sinopsis.");
        return;
      }

      if (!imagen) {
        imagen = "https://images.unsplash.com/photo-1509114397022-ed747cca3f65?w=500";
      }

      const { error } = await _supabase
        .from("peliculas")
        .insert([{ titulo, genero, imagen, video, sinopsis }]);

      if (error) {
        alert("Error al guardar: " + error.message);
      } else {
        alert("¡Película agregada con éxito!");
        document.getElementById("titulo").value = "";
        document.getElementById("genero").value = "";
        document.getElementById("imagen").value = "";
        document.getElementById("video").value = "";
        document.getElementById("sinopsis").value = "";
        document.getElementById("pinAdmin").value = "";
      }
    }

    // Cambios en tiempo real
    function escucharCambiosEnTiempoReal() {
      _supabase
        .channel("cambios-peliculas")
        .on("postgres_changes", { event: "*", schema: "public", table: "peliculas" }, () => {
          cargarPeliculas();
        })
        .subscribe();
    }

    // Sistema de Me gusta local
    function darLike(boton, id) {
      let textoElemento = boton.querySelector('.texto-like');
      if (boton.classList.contains('like-activo')) {
        boton.classList.remove('like-activo');
        textoElemento.innerText = "Me gusta";
        localStorage.removeItem(id);
      } else {
        boton.classList.add('like-activo');
        textoElemento.innerText = "¡Te gusta!";
        localStorage.setItem(id, "activo");
      }
    }

    // Buscador
    function filtrarPeliculas() {
      let textoBusqueda = document.getElementById('buscador').value.toLowerCase();
      let tarjetas = document.querySelectorAll('.tarjeta');
      tarjetas.forEach(function(tarjeta) {
        let contenido = tarjeta.innerText.toLowerCase();
        tarjeta.style.display = contenido.includes(textoBusqueda) ? "block" : "none";
      });
    }
  </script>
</body>
</html>
